name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-test:
    name: Build and Test Release
    runs-on: ubuntu-latest

    container:
      image: registry.fedoraproject.org/fedora:44

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Install dependencies
        run: |
          dnf install -y \
            gcc gcc-c++ \
            meson ninja-build pkgconf-pkg-config \
            flex bison \
            cairo-devel libpng-devel libjpeg-turbo-devel \
            libwebp-devel zlib-devel \
            libicu-devel pango-devel \
            pixman-devel fontconfig-devel glib2-devel \
            libX11-devel libX11-xcb libXcursor-devel \
            libxkbcommon-devel libxkbcommon-x11-devel \
            wayland-devel

      - name: Configure
        run: meson setup builddir

      - name: Build
        run: ninja -C builddir

      - name: Run kernel tests
        run: ./run_kernel_tests.sh

      - name: Run unit tests
        run: |
          ./run_unit_tests.sh \
            App \
            SupportKit \
            LocaleKit \
            NetAPI \
            BFile \
            BNode \
            BPath \
            BDirectory \
            BSymLink \
            BVolume


  package-deb:
    name: Build Debian Packages
    needs: build-and-test
    runs-on: ubuntu-26.04

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            meson ninja-build pkg-config \
            flex bison \
            libcairo2-dev libpng-dev libjpeg-dev libwebp-dev libtiff-dev \
            zlib1g-dev \
            libicu-dev libpango1.0-dev libicns-dev libraw-dev \
            libpixman-1-dev libfontconfig1-dev libglib2.0-dev \
            libx11-dev libx11-xcb-dev libxcursor-dev libxrandr-dev \
            libxkbcommon-dev libxkbcommon-x11-dev \
            libwayland-dev libfuse3-dev \
            debhelper dpkg-dev fakeroot

      - name: Build Debian packages
        run: |
          make deb

      - name: Show generated packages
        run: |
          echo "Generated Debian packages:"
          ls -lh debian/packages/

      - name: Upload Debian packages
        uses: actions/upload-artifact@v4
        with:
          name: deb-packages
          path: debian/packages/*.deb


  package-rpm:
    name: Build Fedora RPM Packages
    needs: build-and-test
    runs-on: ubuntu-latest

    container:
      image: registry.fedoraproject.org/fedora:44

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Install build dependencies
        run: |
          dnf install -y \
            rpm-build \
            gcc gcc-c++ \
            meson ninja-build pkgconf-pkg-config \
            flex bison \
            cairo-devel fontconfig-devel freetype-devel glib2-devel \
            libicns-devel libicu-devel libjpeg-turbo-devel \
            pango-devel pixman-devel libpng-devel LibRaw-devel libtiff-devel \
            wayland-devel libwebp-devel \
            libX11-devel libXcursor-devel libXrandr-devel \
            libxkbcommon-devel libxkbcommon-x11-devel \
            fuse3-devel zlib-ng-compat-devel

      - name: Build RPM packages
        run: make rpm

      - name: Show generated packages
        run: |
          echo "Generated Fedora packages:"
          find rpm/packages -type f -name '*.rpm' -exec ls -lh {} +

      - name: Upload RPM packages
        uses: actions/upload-artifact@v4
        with:
          name: rpm-packages
          path: |
            rpm/packages/*.rpm
            rpm/packages/**/*.rpm


  release:
    name: Publish GitHub Release
    needs: [package-deb, package-rpm]
    runs-on: ubuntu-26.04

    steps:
      - name: Download Debian packages
        uses: actions/download-artifact@v5
        with:
          name: deb-packages
          path: debian/packages

      - name: Download RPM packages
        uses: actions/download-artifact@v5
        with:
          name: rpm-packages
          path: rpm/packages

      - name: Show release files
        run: |
          find debian/packages rpm/packages -type f \( -name '*.deb' -o -name '*.rpm' \) -exec ls -lh {} +

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          mapfile -d '' DEB_PACKAGES < <(find debian/packages -type f -name '*.deb' -print0)
          mapfile -d '' RPM_PACKAGES < <(find rpm/packages -type f -name '*.rpm' -print0)

          if gh release view "$TAG" >/dev/null 2>&1; then
              gh release upload "$TAG" "${DEB_PACKAGES[@]}" "${RPM_PACKAGES[@]}" --clobber
          else
            gh release create "$TAG" \
              "${DEB_PACKAGES[@]}" "${RPM_PACKAGES[@]}" \
              --title "$TAG" \
              --generate-notes
          fi