# Cross file for a distribution-provided MinGW-w64 toolchain, as packaged by
# Fedora (mingw64-gcc, mingw64-gcc-c++, mingw64-binutils and the mingw64-*
# libraries). On other distributions check the compiler names and the sysroot
# location before using this file.
#
# Use with:
#   meson setup builddir-windows --cross-file cross-mingw.ini
#
# MXE users should keep using cross-mxe.ini.

[binaries]
c = '/usr/bin/x86_64-w64-mingw32-gcc'
cpp = '/usr/bin/x86_64-w64-mingw32-g++'
ar = '/usr/bin/x86_64-w64-mingw32-ar'
strip = '/usr/bin/x86_64-w64-mingw32-strip'
windres = '/usr/bin/x86_64-w64-mingw32-windres'
# Plain pkgconf limited to the MinGW sysroot. The distribution's
# x86_64-w64-mingw32-pkg-config wrapper does the same thing; naming pkgconf
# directly makes it explicit that host .pc files are never consulted.
pkg-config = '/usr/bin/pkgconf'

[host_machine]
system = 'windows'
cpu_family = 'x86_64'
cpu = 'x86_64'
endian = 'little'

[properties]
# sys_root is deliberately not set: the compiler already has its sysroot
# compiled in, and the .pc files carry absolute paths. Setting it here would
# make pkg-config prepend the sysroot to those paths a second time.
pkg_config_libdir = '/usr/x86_64-w64-mingw32/sys-root/mingw/lib/pkgconfig'
